name: Gemini Connectivity Diagnostic

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model to test"
        required: false
        default: "gemini-3.7-flash"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test minimal Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model || 'gemini-3.7-flash' }}
        run: |
          set -e
          echo "=== Gemini Connectivity Diagnostic ==="
          echo "model: $MODEL"
          echo ""

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is not set."
            echo "Add it in: GitHub repo > Settings > Secrets and variables > Actions"
            exit 1
          fi

          API_URL="https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent"

          echo "Sending minimal generateContent request..."
          START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /tmp/gemini_response.json -w "%{http_code}" \
            -X POST "${API_URL}?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"Return only: {\"ok\": true}"}]}],"generationConfig":{"maxOutputTokens":20}}' \
            --max-time 30)
          END=$(date +%s%N)

          ELAPSED_MS=$(( (END - START) / 1000000 ))
          ELAPSED_S=$(echo "scale=2; $ELAPSED_MS / 1000" | bc)

          echo ""
          echo "=== Minimal Request Results ==="
          echo "model:        $MODEL"
          echo "http_status:  $HTTP_CODE"
          echo "latency:      ${ELAPSED_S}s (${ELAPSED_MS}ms)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "result:       OK"
          else
            echo "result:       FAILED"
            python3 -c "
          import json
          try:
              data = json.load(open('/tmp/gemini_response.json'))
              err = data.get('error', {})
              print(f'error_code:    {err.get(\"code\", \"unknown\")}')
              print(f'error_message: {err.get(\"message\", \"unknown\")}')
              print(f'error_status:  {err.get(\"status\", \"unknown\")}')
          except Exception:
              print('Could not parse error response')
          "
          fi

      - name: Test production-shaped Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model || 'gemini-3.7-flash' }}
        run: |
          set -e
          echo ""
          echo "============================================"
          echo "=== Production-Shaped Request Diagnostic ==="
          echo "============================================"
          echo "model: $MODEL"
          echo ""

          API_URL="https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent"

          cat > /tmp/gemini_prod_test.py << 'PYEOF'
          import json, time, urllib.request, urllib.error, os

          prompt = (
              "You are a study planner for a student. Create a daily study plan for 2026-08-14.\n"
              "\n"
              "AVAILABLE STUDY TIME:\n"
              "  1. 09:00-11:30 (150 min, energy: high)\n"
              "  2. 14:00-16:00 (120 min, energy: medium)\n"
              "  3. 19:00-21:00 (120 min, energy: low)\n"
              "\n"
              "BACKLOG ITEMS (sorted by priority):\n"
              "  1. [Mathematics] Derivatives homework (OVERDUE) - 45 min - priority 1, due: 2026-08-12\n"
              "  2. [Physics] Wave mechanics worksheet - 60 min - priority 2, due: 2026-08-16\n"
              "  3. [English] Essay draft - 90 min - priority 2, due: 2026-08-18\n"
              "  4. [Chemistry] Lab report - 75 min - priority 3, due: 2026-08-20\n"
              "  5. [History] Chapter review - 40 min - priority 3\n"
              "  6. [Biology] Flashcard set - 30 min - priority 4\n"
              "\n"
              "BACKLOG HEALTH:\n"
              "  pending_items: 6, overdue_items: 1, health_score: fair\n"
              "\n"
              "TOTALS:\n"
              "  total_available_minutes: 390, total_required_minutes: 340, estimated_days_to_clear: 2\n"
              "\n"
              "TASK:\n"
              "Create a study plan that schedules as many backlog items as possible within the available time windows.\n"
              "- Each session must fit entirely within one available time window.\n"
              "- Sessions cannot overlap.\n"
              "- Respect the estimated_minutes for each item.\n"
              "- Allocate more time to higher-priority items.\n"
              "\n"
              "OUTPUT FORMAT:\n"
              "Return ONLY valid JSON with this exact structure:\n"
              "{\n"
              '    "sessions": [\n'
              "        {\n"
              '            "backlog_item_id": "<task-id>",\n'
              '            "start_time": "HH:MM",\n'
              '            "end_time": "HH:MM",\n'
              '            "reason": "Brief explanation"\n'
              "        }\n"
              "    ],\n"
              '    "daily_message": "A short encouraging message for the student",\n'
              '    "overflow": ["<task-id>"]\n'
              "}\n"
              "\n"
              "- backlog_item_id must be one of the IDs listed above.\n"
              "- overflow contains IDs of items that could not be scheduled.\n"
              "- Times must be in 24-hour format within the available windows above.\n"
              "- Respond with ONLY the JSON object, no other text."
          )

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.2,
                  "topP": 0.8,
                  "topK": 40,
                  "maxOutputTokens": 2048
              }
          }

          api_url = os.environ["API_URL"]
          api_key = os.environ["GEMINI_API_KEY"]
          model = os.environ["MODEL"]

          t0 = time.monotonic()
          try:
              req = urllib.request.Request(
                  f"{api_url}?key={api_key}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              resp = urllib.request.urlopen(req, timeout=30)
              latency = time.monotonic() - t0
              print(f"model:        {model}")
              print(f"http_status:  {resp.status}")
              print(f"latency:      {latency:.2f}s")
              print(f"result:       OK")
          except urllib.error.HTTPError as e:
              latency = time.monotonic() - t0
              body = e.read().decode()
              print(f"model:        {model}")
              print(f"http_status:  {e.code}")
              print(f"latency:      {latency:.2f}s")
              print(f"result:       FAILED")
              try:
                  err = json.loads(body).get("error", {})
                  print(f"error_code:    {err.get('code', 'unknown')}")
                  print(f"error_message: {err.get('message', 'unknown')}")
                  print(f"error_status:  {err.get('status', 'unknown')}")
              except Exception:
                  print(f"error:        {body[:200]}")
          except Exception as e:
              latency = time.monotonic() - t0
              print(f"model:        {model}")
              print(f"latency:      {latency:.2f}s")
              print(f"result:       FAILED")
              print(f"error:        {type(e).__name__}: {e}")
          PYEOF

          python3 /tmp/gemini_prod_test.py

          echo ""
          echo "=== Production-Shaped Diagnostic Complete ==="
